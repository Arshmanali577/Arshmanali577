<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 12" width="1200" height="12" role="img" aria-label="">
  <defs>
    <linearGradient id="dline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00F5D4" stop-opacity="0"/>
      <stop offset="18%" stop-color="#00F5D4" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#8E2DE2" stop-opacity="0.95"/>
      <stop offset="82%" stop-color="#FF2E97" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FF2E97" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="dspark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="5" width="1200" height="2" rx="1" fill="url(#dline)"/>
  <rect x="-200" y="5" width="200" height="2" rx="1" fill="url(#dspark)">
    <animate attributeName="x" from="-200" to="1200" dur="5s" repeatCount="indefinite"/>
  </rect>
  <circle cx="600" cy="6" r="3.5" fill="#00F5D4">
    <animate attributeName="r" values="2.5;4.5;2.5" dur="2.6s" repeatCount="indefinite"/>
  </circle>
</svg>
